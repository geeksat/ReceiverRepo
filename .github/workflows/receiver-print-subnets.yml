name: ZZZ Receiver Dispatch Test
run-name: ZZZ Receiver Dispatch Test - ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      location:
        required: true
        type: string
      vnet_name:
        required: true
        type: string
      subnets_json:
        required: true
        type: string

jobs:
  receive:
    name: ZZZ Receiver Job
    runs-on: ubuntu-latest

    steps:
      - name: Print proof Repo B was independently triggered
        shell: pwsh
        run: |
          Write-Host "REPO B GOT A REAL workflow_dispatch RUN"
          Write-Host "Source Repo: ${{ inputs.source_repo }}"
          Write-Host "Source Run ID: ${{ inputs.source_run_id }}"
          Write-Host "Location: ${{ inputs.location }}"
          Write-Host "VNet Name: ${{ inputs.vnet_name }}"
          Write-Host "Subnets JSON: ${{ inputs.subnets_json }}"
