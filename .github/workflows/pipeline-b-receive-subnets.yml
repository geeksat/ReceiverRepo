name: Pipeline B - Receive Subnets

on:
  workflow_call:
    inputs:
      source_repo:
        required: false
        type: string
      source_run_id:
        required: false
        type: string
      location:
        required: true
        type: string
      vnet_name:
        required: true
        type: string
      subnet_values_json:
        required: true
        type: string

jobs:
  stage_a_receive_and_print:
    name: Pipeline B - Stage A - ReceiveAndPrint
    runs-on: ubuntu-latest

    steps:
      - name: Print values received from Repo A
        shell: pwsh
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          LOCATION: ${{ inputs.location }}
          VNET_NAME: ${{ inputs.vnet_name }}
          SUBNET_VALUES_JSON: ${{ inputs.subnet_values_json }}
        run: |
          $subnets = $env:SUBNET_VALUES_JSON | ConvertFrom-Json

          Write-Host "Received values in Pipeline B"
          Write-Host "Source Repo: $env:SOURCE_REPO"
          Write-Host "Source Run ID: $env:SOURCE_RUN_ID"
          Write-Host "Location: $env:LOCATION"
          Write-Host "VNet Name: $env:VNET_NAME"
          Write-Host "Total Subnets: $($subnets.Count)"

          foreach ($subnet in $subnets) {
              Write-Host "Subnet Name: $($subnet.name)"
              Write-Host "Subnet CIDR: $($subnet.cidr)"
              Write-Host "Subnet Type: $($subnet.type)"
              Write-Host "---"
          }
